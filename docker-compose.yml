# Emby + AI 字幕本地语音识别服务（针对 Intel N5105 4核 + 16GB 内存优化）
# 如果你已经有在跑的 Emby 容器，只需要启动下面的 emby-ai-whisper 服务即可。
services:
  emby-ai-whisper:
    image: ghcr.io/axeomi1/omi-aisubtitles-whisper:latest
    build: ./whisper-service
    container_name: emby-ai-whisper
    shm_size: "512m"                 # 利用 16G 大内存，在内存盘暂存音频切片，零机械硬盘读写
    environment:
      # small 兼顾日语/英语准确率与速度（仅占 ~1GB 内存）；想极限提速可改 base
      - WHISPER_MODEL=small
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8    # 开启 N5105 AVX2/VNNI int8 硬件指令加速
      - WHISPER_CPU_THREADS=3        # N5105 共 4 核，分 3 核给语音识别，留 1 核给 Emby 播放不卡顿
      - WHISPER_BEAM_SIZE=1          # 贪婪解码，比默认 5 快 2.5 倍以上
      - MAX_CONCURRENCY=1
      - HF_ENDPOINT=https://hf-mirror.com   # 国内镜像高速下载模型
    volumes:
      - ./whisper-models:/models     # 模型缓存目录，首次启动下载一次后永久复用
    ports:
      - "8000:8000"                  # 暴露 8000 端口，Emby 插件直接填 http://NAS的IP:8000/v1 即可连上
    restart: unless-stopped
